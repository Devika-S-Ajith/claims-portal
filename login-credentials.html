<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Claims Portal – Sign in</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // Step 2 of 2. Reached only from login.html with ?role=Admin or ?role=Manager.
    // Validates the email against the accounts that hold the chosen role, so a
    // manager's address cannot be used to sign in through the Admin door.

    const DEMO_PASSWORD = 'password';
    const SUFFIX = { Admin: 'a', Manager: 'm' };

    let role = '';
    let accounts = [];

    function fail(html) {
      const msg = document.getElementById('msg');
      if (msg) msg.innerHTML = html;
    }

    function signIn() {
      const em = document.getElementById('em');
      const pw = document.getElementById('pw');
      const email = (em ? em.value : '').trim().toLowerCase();
      const password = pw ? pw.value : '';
      const user = accounts.find((o) => o.email.toLowerCase() === email);

      if (!email || !password) {
        fail('<div class="err">Enter your email address and password.</div>');
        return;
      }
      if (!user) {
        fail(`<div class="err">No ${esc(role.toLowerCase())} account uses that email address.</div>`);
        return;
      }
      if (password !== DEMO_PASSWORD) {
        fail('<div class="err">That password is not correct.</div>');
        return;
      }
      if (user.status === 'Inactive') {
        fail(`<div class="err">${esc(user.name)}'s account is ${user.status.toLowerCase()}. Ask an admin to reactivate it.</div>`);
        return;
      }

      fail('');
      setSession(user);
      location.href = 'dashboard.html';
    }

    function render() {
      const app = document.getElementById('app');
      if (!app) return;

      const icon = role === 'Admin' ? '&#9819;' : '&#128100;';
      const blurb = role === 'Admin'
        ? 'Sign in to see every claim and the Admin Dashboard.'
        : 'Sign in to see the claims routed to you.';

      app.innerHTML = `
        <div class="login-head">
          <div class="logo" style="margin-bottom:4px"><i></i>Claims Portal</div>
          <p class="mu" style="margin:0">Signing in as <b>${esc(role)}</b></p>
        </div>

        <div class="card credcard ${role === 'Admin' ? 'adm' : 'mgr'}">
          <div class="row" style="align-items:center;margin-bottom:4px">
            <span class="ricon">${icon}</span>
            <b class="rtitle">${esc(role)} sign in</b>
          </div>
          <p class="mu" style="font-size:13px;margin:0 0 4px">${esc(blurb)}</p>

          <div class="rform" style="border-top:0;padding-top:12px;margin-top:12px">
            <label for="em">Email</label>
            <input id="em" type="email" autocomplete="username" placeholder="name@co.com">
            <label for="pw">Password</label>
            <input id="pw" type="password" autocomplete="current-password">
            <button class="btn p" style="width:100%;margin-top:14px" onclick="signIn()">Sign in</button>
          </div>

          <div id="msg" style="margin-top:12px"></div>

          <a class="mu backlink" href="login.html">&larr; Back to role selection</a>
        </div>

        <details class="card demo">
          <summary class="mu">Demo accounts for ${esc(role)}</summary>
          <div class="people" style="margin-top:10px">
            ${accounts.map((o) => `
              <button type="button" class="person ${o.status === 'Inactive' ? 'off' : ''}"
                      onclick="document.getElementById('em').value='${esc(o.email)}';document.getElementById('pw').value='${DEMO_PASSWORD}'">
                <span class="avatar">${initials(o.name)}</span>
                <span class="pinfo">
                  <b>${esc(o.name)}</b>
                  <span class="mu">${esc(o.email)}</span>
                </span>
                ${o.status === 'Inactive' ? '<span class="b Rejected">Inactive</span>' : ''}
              </button>`).join('')}
          </div>
          <p class="mu" style="font-size:12px;margin:10px 0 0">Every demo account uses the password <b>${DEMO_PASSWORD}</b>.</p>
        </details>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const wanted = new URLSearchParams(location.search).get('role');
      role = wanted === 'Manager' ? 'Manager' : wanted === 'Admin' ? 'Admin' : '';

      if (!role) {
        // Step 2 is not a valid starting point on its own.
        location.href = 'login.html';
        return;
      }

      accounts = OWNERS.filter((o) => o.role === role);
      render();
    });
  </script>
</head>
<body>
  <div class="login">
    <div class="loginwrap" id="app"></div>
  </div>
</body>
</html>
