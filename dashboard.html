<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Claims Portal — Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // Chart palette. The old set was three blues/purples in a row (indigo
    // #6366f1, blue #3b82c4, purple #7d4fc0), which are near-identical once they
    // sit next to each other at slice size, so neighbouring wedges read as one
    // shape. This set is drawn from the Okabe-Ito colour-blind-safe palette and
    // is ordered so no two adjacent entries are close in hue *or* in lightness -
    // adjacent slices are always separated on both axes. Every entry is also
    // checked against --card for contrast, so a swatch is legible on white and
    // on the dark card alike.
    const COLORS = [
      '#4269d0', // blue
      '#e87d24', // orange
      '#149e6e', // green
      '#911eb4', // magenta
      '#56b4e9', // sky
      '#d3455b', // red
      '#8c6d31', // brown
      '#f0c941' // yellow
    ];

    // Status gets meaning, not just a colour: resolved claims are the good
    // outcome, denied and cancelled are the two ways a claim does not get paid,
    // and open is the backlog. Reading the ring should not require the legend,
    // so each status keeps the same colour in every chart and every year.
    const STATUS_COLOR = {
      Resolved: '#149e6e',
      Open: '#4269d0',
      Denied: '#d3455b',
      Cancelled: '#8c6d31'
    };
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const TYPES_TOP = 10;

    let year = LATEST_YEAR;
    let typesExpanded = false;
    // Department comparison used to be three charts, then one table behind a
    // measure picker; it is one table with a column per measure now, so there is
    // no rate to remember between renders. deptSort is the active column, deptDir
    // the direction within it, and the page opens on Count descending.
    let deptSort = 'count';
    let deptDir = -1;
    // 'amount' or 'share' for the ranked credit bars under Where the Money Goes.
    let deptMoney = 'amount';
    // 'claims' | 'credit' | 'open' | any of the reason keys below | 'name' for the
    // carrier scorecard.
    let carSort = 'claims';
    let carDir = -1;
    const metric = { types: 'count' };

    const pnum = (a, b) => (b ? (a / b) * 100 : 0);

    function zeroBlock(label) {
      return {
        range: label, total: 0, credit: 0, avgCredit: 0, credited: 0, creditIssued: 0,
        memos: 0, maxClaim: 0, resolved: 0, open: 0, cancelled: 0, denied: 0,
        unresolved: 0, unfinished: 0, noRca: 0, rcaFilled: 0, unassigned: 0,
        repeatOrders: 0, repeatClaims: 0, repeatCredit: 0, medianDays: 0, p90Days: 0,
        sameDayPct: 0, resolvedTimed: 0, raisers: 0, capaFilled: 0, paFilled: 0,
        orders: 0, orderClaims: 0, multiOrders: 0, claimsPerOrder: 0, repeatRate: 0,
        noCredit: 0, sampleClaims: 0,
        status: [['Open', 0, 0]], area: [], dist: [], types: [], dept: [], months: [],
        typeMonths: []
      };
    }

    function stats(y) {
      const me = getSession();
      if (isAdmin()) return CLAIM_STATS_BY_YEAR[y] || zeroBlock('No ' + y + ' claims');
      return (CLAIM_STATS_BY_YEAR_OWNER[y] || {})[me.id] || zeroBlock('No ' + y + ' claims for ' + me.id);
    }

    // The nine departments the portal reports on, in reporting order, with the
    // owner each is routed to. Read off DEPT_INDEX rather than asserted here, so
    // the list cannot drift from the export.
    const DEPT_UNIVERSE = DEPT_INDEX.map(([key, , , owner]) => ({ key, owner }));

    // [dept, owner, area, claims, orders, open, credit, openCredit, memo, repeatOrders, noCredit]
    function deptFacts() {
      const bucket = DEPT_FACTS[year] || DEPT_FACTS.all || { all: [] };
      const me = getSession();
      const rows = isAdmin() ? (bucket.all || []) : (bucket[me.id] || []);
      const byName = new Map(rows.map((r) => [r[0], r]));
      const scope = isAdmin() ? null : me.id;
      // Every department in scope is listed, including one that raised nothing
      // this year. Dropping it would claim the department does not exist, which
      // is a different claim from "raised no claims" - and a department with no
      // rows in any year, like Overseas, would otherwise disappear from the page
      // altogether. The fill row is zeros throughout, so its figures and its
      // pop-up read off the same row shape as a populated one rather than
      // special-casing emptiness downstream.
      return DEPT_UNIVERSE
        .filter((u) => scope === null || u.owner === scope)
        .map((u) => byName.get(u.key) || [u.key, u.owner, areaOfDept(u.key), 0, 0, 0, 0, 0, 0, 0, 0]);
    }

    // [name, claims, orders, open, openCredit, credit, damageClaims, medianDays, p90Days, timedCloses]
    // Scoped exactly like deptFacts. Re-aggregated per owner in the build rather
    // than filtered, because a carrier's claims are spread across every owner.
    function carrierFacts() {
      const bucket = CARRIER_FACTS[year] || CARRIER_FACTS.all || { all: [] };
      const me = getSession();
      return isAdmin() ? (bucket.all || []) : (bucket[me.id] || []);
    }

    // The queue covers every open claim ever raised. The dashboard is year
    // scoped, so it is cut to the selected year - which also means every count
    // on this page is the same population the card pop-ups describe.
    function queue() {
      return scopedQueue().filter((r) => String(r.date || '').slice(0, 4) === String(year));
    }

    let S, PREV;

    // ---------- small shared pieces ----------
    // Direction and size only - no colour, no good/bad verdict, no pre-built
    // string. The stat line builds the sentence from this, because whether a rise
    // is welcome depends on the line: more claims raised is not obviously good
    // news, and more credit given is not good news at all.
    function delta(now, prev) {
      if (!prev) return null;
      const d = (now - prev) / prev;
      return { dir: d > 0 ? 'up' : d < 0 ? 'down' : 'flat', mag: Math.abs(d * 100).toFixed(1) + '%' };
    }

    // Compact money for axis ticks and labels that only have ~50px of width.
    const usdK = (n) =>
      n >= 1000 ? '$' + (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'K' : '$' + Math.round(n);

    // Section and card headings, with the grey sub-line removed. Both used to
    // take a note and print it under the heading, but every note was either
    // restating the heading ("Claims by warehouse" / "Ranked by claims raised in
    // 2026") or a use instruction rather than information about the data.
    // The right-hand slot is untouched, so the controls that live there - the
    // metric selectors, the year badge - still render.
    //
    // The callouts that sit under a *chart* rather than a heading are a
    // different thing and stay: they carry data caveats (mock warehouse values,
    // credit raised with no memo sent), which are not decoration.
    function sect(title, note, right) {
      return (
        `<div class="row sec">` +
        `<div><h2>${title}</h2></div>` +
        `<div class="sp"></div>${right || ''}</div>`
      );
    }

    function cardTitle(t, note, right) {
      return `<div class="row cht"><h3>${t}</h3><div class="sp"></div>${right || ''}</div>`;
    }

    // Like-for-like: the current year is a part year, so last year is cut to the
    // same number of months. Comparing 9 months of 2026 against 12 of 2025 is
    // the single easiest way to make a trend look like a collapse.
    function monthsSoFar() {
      let n = 0;
      S.months.forEach((m, i) => { if (m[0] > 0) n = i + 1; });
      return n || 12;
    }
    function upTo(block, n) {
      let c = 0, v = 0;
      for (let i = 0; i < n; i++) { c += block.months[i] ? block.months[i][0] : 0; v += block.months[i] ? block.months[i][1] : 0; }
      return { c, v };
    }

    // ---------- charts ----------
    // Donut plus a per-team-area breakdown. This card shares a grid row with two
    // ten-row bar lists, so a bare donut and a three-line legend left most of the
    // card blank. The breakdown reuses the arc colours, adds a share bar per area
    // and calls out the area that dominates, which is the thing a reader is
    // actually looking for. The card itself is a flex column (.dcard) so the
    // breakdown can absorb whatever height the neighbouring cards set.
    function donut(key, data) {
if (!data.length) return '<p class="mu">No claims in this year.</p>';
      const byValue = metric[key] === 'value';
      const i = byValue ? 2 : 1;
      // Status is coloured by meaning (see STATUS_COLOR); team area falls back
      // to the categorical palette.
      const color = key === 'status'
        ? (name) => STATUS_COLOR[name] || COLORS[0]
        : (n) => COLORS[n % COLORS.length];
      const colorAt = (d, n) => color(key === 'status' ? d[0] : n);
      const countTotal = data.reduce((s, d) => s + d[1], 0) || 1;
      const total = byValue ? data.reduce((s, d) => s + d[2], 0) : countTotal;

// A gap between segments, in the same 0-100 units the arcs are drawn in. Without
      // it two adjacent arcs butt together and their shared edge disappears, so
      // a 3% slice next to a 40% slice has no visible boundary. The gap is taken
      // out of the drawn length rather than added to it, so the ring still adds
      // up to 100% and no slice is pushed out of alignment. A slice too small to
      // lose the gap keeps a sliver rather than vanishing.
      const GAP = 1.2;
      let offset = 25;
      const arcs = data.map((d, n) => {
        const p = (d[i] / total) * 100;
        const draw = Math.max(p - GAP, Math.min(p, 0.35));
        const c = colorAt(d, n);
        const arc = `<circle r="15.9" cx="21" cy="21" fill="none" stroke="${c}" stroke-width="6" stroke-dasharray="${draw.toFixed(2)} ${(100 - draw).toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"><title>${esc(d[0])}: ${fmt(key, d[i])} (${p.toFixed(1)}%)</title></circle>`;
        offset -= p;
        return arc;
      }).join('');

      const rows = data.map((d, n) => `
        <div class="drow">
            <div class="dline">
              <span class="dlbl"><i style="background:${colorAt(d, n)}"></i><span title="${esc(d[0])}">${esc(d[0])}</span></span>
              <b>${fmt(key, d[i])}</b><em>${pnum(d[i], total).toFixed(1)}%</em>
            </div>
            <div class="trk"><span style="width:${pnum(d[i], total).toFixed(1)}%;background:${colorAt(d, n)}"></span></div>
          </div>`).join('');

      // The callout ("<status> carries 82% - biggest team area") and the two
      // figures beside the ring are both gone. The callout named the largest
      // slice and the card title above already says what the chart is, so it
      // restated the donut in words; "biggest team area" was also wrong wording
      // for a status card. The side figures repeated what the centre prints as
      // a percentage and what the breakdown prints as counts. What is left is
      // the ring, its centre and the per-status rows underneath.
      //
      // The centre used to print the year's total claim count, which the stat
      // line at the top of the page already states, and the breakdown under it
      // repeated the same figure again as a dollars total. Both are gone: the
      // centre now carries a measure the page states nowhere else, and the
      // breakdown carries composition only.
      //
      // "Resolved" is the status bucket, not "not ClaimResolved", so denied and
      // cancelled claims are not counted as unfinished work here.
      const centerPct = S.total ? (S.resolved / S.total) * 100 : 0;
      const labelKey = key === 'status' ? 'status' : (key === 'area' ? 'team area' : key);
      return (
        `<div class="dtop">
            <svg class="donut" width="132" height="132" viewBox="0 0 42 42" role="img" aria-label="Share of claims by ${labelKey}">${arcs}` +
            `<text x="21" y="22" text-anchor="middle" font-size="6.2" font-weight="600" fill="currentColor">${centerPct.toFixed(1)}%</text>` +
            `<text x="21" y="26.4" text-anchor="middle" font-size="2.5" font-weight="600" fill="#8fa69a" letter-spacing=".06em">RESOLVED</text></svg>
          </div>
          <div class="dlist">${rows}</div>`
      );
    }

    // [name, claims, credit]
    // Scoped exactly like deptFacts. Re-aggregated per owner in the build rather
    // than filtered, because one warehouse draws claims from every department
    // and therefore from every owner.
    function whFacts() {
      const bucket = WH_FACTS[year] || WH_FACTS.all || { all: [] };
      const me = getSession();
      return isAdmin() ? (bucket.all || []) : (bucket[me.id] || []);
    }

    // Warehouse share, drawn the same way as the status ring beside it: an arc
    // ring with a figure in the middle and a per-site breakdown underneath. It
    // used to be a filled pie with the legend set alongside it, which made the
    // two cards in this row look like different products - one ring, one solid
    // disc - and left the warehouse card with no headline figure of its own.
    // Matching the status card means a reader who has learnt to read one of them
    // can read the other without looking twice.
    //
    // The sites stay ordered by claims with the largest first: the reader is
    // ranking, not just reading a share. A ring is drawn for every site,
    // including one with no claims, so a site cannot quietly vanish.
    function pie(rows) {
      const total = rows.reduce((a, d) => a + d[1], 0);
      if (!total) return '<p class="mu">No claims in this year.</p>';
      const color = (n) => COLORS[n % COLORS.length];

      // Same gap treatment as the status ring: taken out of each arc's length
      // rather than added, so the arcs still total 100% and nothing drifts out
      // of alignment. Arcs start at 12 o'clock and run clockwise.
      const GAP = 1.2;
      let offset = 25;
      const arcs = rows.map((d, n) => {
        const p = (d[1] / total) * 100;
        const draw = Math.max(p - GAP, Math.min(p, 0.35));
        const arc = `<circle r="15.9" cx="21" cy="21" fill="none" stroke="${color(n)}" stroke-width="6" stroke-dasharray="${draw.toFixed(2)} ${(100 - draw).toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"><title>Warehouse ${esc(d[0])}: ${num(d[1])} claims (${p.toFixed(1)}%)</title></circle>`;
        offset -= p;
        return arc;
      }).join('');

      // Same row shape as the status breakdown: swatch, name, count, share, bar.
      // The site code is the whole name, so it is the only label on the row - and
      // a four-character code left the count sitting 8px away at the same weight,
      // so "8825  2,988" read as one string. The row carries .whd, which pushes
      // the code to the left edge and the two figures to the right, so the label
      // and the measures are two separate groups rather than one run of digits.
      const rows_ = rows.map((d, n) => `
          <div class="drow whd">
            <div class="dline">
              <span class="dlbl"><i style="background:${color(n)}"></i><b class="wk">${esc(d[0])}</b></span>
              <b class="wcnt">${num(d[1])}</b><em>${pnum(d[1], total).toFixed(1)}%</em>
            </div>
            <div class="trk"><span style="width:${pnum(d[1], total).toFixed(1)}%;background:${color(n)}"></span></div>
          </div>`).join('');

      // The centre carries the largest site's share - the one number a reader
      // wants off this card, and the reason the rows are ranked the way they
      // are. With a single site claiming everything this reads 100%, which is
      // correct rather than a division by zero.
      const top = rows[0];
      const topPct = pnum(top[1], total);

      return (
        `<div class="dtop">
            <svg class="donut" width="132" height="132" viewBox="0 0 42 42" role="img" aria-label="Share of ${year} claims by warehouse">${arcs}` +
            `<text x="21" y="22" text-anchor="middle" font-size="6.2" font-weight="600" fill="currentColor">${topPct.toFixed(1)}%</text>` +
            `<text x="21" y="26.4" text-anchor="middle" font-size="2.5" font-weight="600" fill="#8fa69a" letter-spacing=".06em">TOP SITE</text></svg>
          </div>
          <div class="dlist">${rows_}</div>`
      );
    }

    function whPie() {
      return pie(whFacts()) + `
        <p class="mu" style="margin:10px 0 0;font-size:12px">The export has no site feed, so the split across
        ${WAREHOUSES.length} warehouses is mocked from its <code>Warehouse</code> column, and it carries no unit
        counts &mdash; these are shares of all claims, not defect rates against goods handled.</p>`;
    }

    // [name, claims, credit]
    function hbar(key, data, max) {
      const i = metric[key] === 'value' ? 2 : 1;
      const top = max || Math.max(...data.map((d) => d[i]), 1);
      return data.map((d) => {
        const v = d[i];
        return (
          `<div class="hb${metric[key] === 'value' ? ' wide' : ''}">` +
          `<div title="${esc(d[0])}">${esc(d[0])}</div>` +
          `<div class="trk"><span style="width:${pnum(v, top).toFixed(1)}%"></span></div>` +
          `<b>${fmt(key, v)}</b></div>`
        );
      }).join('');
    }

    // Credit by department, ranked, with the share of the whole available as a
    // second reading of the same column. This absorbs both charts it replaces:
    // the old "Credit by department" count/credit toggle and the paired
    // credit-vs-memo chart. Both were read off the same DEPT_FACTS credit column,
    // so side by side they were two ways of reading one number. The memo gap -
    // credit promised and never converted into a credit memo - is real
    // information, so it survives as a figure under the bars instead of as a
    // second set of bars.
    function deptCreditBars(df) {
      const rows = df.slice().sort((a, b) => b[6] - a[6]).slice(0, 8);
      const total = df.reduce((a, d) => a + (d[6] || 0), 0);
      const max = Math.max(...rows.map((d) => d[6]), 1);
      const byShare = deptMoney === 'share';
      return rows.map((d) => `
          <div class="hb wide">
            <div title="${esc(d[0])}">${esc(d[0])}</div>
            <div class="trk"><span style="width:${(byShare ? pnum(d[6], total) : pnum(d[6], max)).toFixed(1)}%"></span></div>
            <b>${byShare ? pct(d[6], total) : usd(d[6])}</b>
          </div>`).join('');
    }

    // One row per department, every measure a column of its own. This replaced a
    // three-tab control that swapped one measure into a single trailing column, so
    // comparing a department's volume against its money against its open pile meant
    // switching tabs and holding the previous reading in your head; and a tab could
    // only ever show the one measure, so no two were ever on screen together. The
    // row is the unit of comparison now and no measure is ever behind a toggle.
    //
    // Raw counts, not rates. "Still open" as a percentage of claims raised made a
    // department with four claims and one open look worse than a department with
    // four hundred and one hundred open, and the tab carried a separate thin-base
    // caveat to admit it. Counts compare honestly between departments of any size,
    // and a count next to Count says what it costs to be that department.
    //
    // Plain numbers, no meters. Each of the three columns carried a bar scaled to
    // the largest value on screen, which made the length of a bar a second
    // encoding of the number printed directly above it - two signals for one value,
    // and the reader had to trust they agreed. Six columns of bare figures scan in
    // one pass and leave the eye free to compare down a column rather than across.
    //
    // Red marks the peak of each column, judged only against the other departments
    // on screen. It is a per-column ranking, not one verdict per department: a
    // department holding the top spot on four measures is marked on all four, and
    // the point of the table is seeing which of those it is. A column where every
    // department ties marks them all, which is the honest reading of a column that
    // does not separate anybody.
    const DEPT_COLS = [
      { k: 'count', label: 'Count', of: (d) => d[3], fmt: num },
      { k: 'credit', label: 'Credit', of: (d) => d[6], fmt: usd },
      { k: 'open', label: 'Still Open', of: (d) => d[5], fmt: num },
      { k: 'repeat', label: 'Repeat Orders', of: (d) => d[9], fmt: num },
      { k: 'per', label: 'Credit/Claim', of: (d) => (d[3] ? d[6] / d[3] : 0), fmt: usd }
    ];

    function deptTable(df) {
      const rows = df.map((d) => {
        const r = { dept: d[0] };
        DEPT_COLS.forEach((c) => { r[c.k] = c.of(d); });
        return r;
      });
      // Each column's own peak, so no measure is judged on another measure's scale.
      const peak = {};
      DEPT_COLS.forEach((c) => { peak[c.k] = rows.length ? Math.max(...rows.map((r) => r[c.k])) : 0; });

      const dir = deptDir;
      const sorted = rows.slice().sort((a, b) =>
        deptSort === 'dept' ? dir * a.dept.localeCompare(b.dept) : dir * (a[deptSort] - b[deptSort])
      );

      const th = (k, label, align) => {
        const on = deptSort === k;
        return `<th class="${align === 'right' ? 'r' : 'l'}${on ? ' on' : ''}" style="text-align:${align}" aria-sort="${on ? (dir === -1 ? 'descending' : 'ascending') : 'none'}">` +
          `<button type="button" onclick="setDeptSort('${k}')">${esc(label)}` +
          `<span class="car">${on ? (dir === -1 ? '&#8595;' : '&#8593;') : ''}</span></button></th>`;
      };

      const body = sorted.map((r) => {
        const cells = DEPT_COLS.map((c) => {
          // A column of all zeros has no peak worth marking, and a zero-summed
          // column would otherwise paint every row red for being indistinguishable.
          const top = peak[c.k] > 0 && r[c.k] === peak[c.k];
          const tip = `${c.label} in ${r.dept}: ${c.fmt(r[c.k])}` +
            (top ? ` — the highest ${c.label.toLowerCase()} of the ${num(rows.length)} departments listed` : '');
          return `<td class="n${top ? ' hi' : ''}" title="${esc(tip)}"><b>${c.fmt(r[c.k])}</b></td>`;
        }).join('');
        return `<tr onclick="openSlice('de','${esc(r.dept)}')" tabindex="0"
            onkeydown="if(event.key==='Enter'||event.key===' '){openSlice('de','${esc(r.dept)}');return false}">
          <td class="name">${esc(r.dept)}</td>${cells}
        </tr>`;
      }).join('');

      return `<div class="tw" style="border:0;margin-top:4px"><table class="ctable dcomp">
          <thead><tr>${th('dept', 'Department', 'left')}${DEPT_COLS.map((c) => th(c.k, c.label, 'right')).join('')}</tr></thead>
          <tbody>${body || `<tr><td colspan="6" class="mu">No departments raised a claim in ${esc(String(year))}.</td></tr>`}</tbody>
        </table></div>`;
    }

    // Carrier scorecard. The export has no Carrier column, so the carrier is read
    // out of the department, the claim type and the description; build-data.js
    // does that once and this is a lookup. Three things are deliberately absent:
    //
    //  - "claim rate, claims as a % of that carrier's total order volume". The
    //    export only lists orders that raised a claim, so the denominator is the
    //    numerator and the rate would read ~100% for everyone. Open claim rate
    //    (open / claims) is the substitute, and it is a real measurement.
    //  - A single carrier per claim. 353 claims name both UPS and FedEx - FedEx
    //    Ground billed to a UPS shipper account, freight split across a truck and
    //    UPS - and they are a row of their own rather than counted twice.
    //  - Any modelling. Every number here is counted out of the CSV.
    // Sort key -> tuple index, so the comparator is a lookup rather than a
    // chain of ternaries. 'p90' is column 8; an untimed carrier reads 0 and
    // sorts last, which is the honest order for an unmeasurable cell.
    //
    // The reason columns used to be one 'Damage or loss' figure, and it was one
    // regex matching damage, loss, wrong item AND late delivery - so a courier
    // that lost parcels and a courier that ran late scored the same. build-data.js
    // splits that into six named reasons, first match wins, so they PARTITION the
    // claims column and the six figures add up to Claims. The last of them is the
    // remainder: claims that name a courier but whose stated reason is a billing
    // or communication dispute, a product fault, or the courier mentioned in
    // passing. Those are not courier failures and are printed muted so they do
    // not read as a peer of the five.
    const CARRIER_KEY = {
      name: 0, claims: 1, open: 3, credit: 5, damage: 6, p90: 8,
      late: 10, wrong: 11, account: 12, freight: 13, none: 14
    };
    const CARRIER_COLS = [
      ['name', 'Carrier', 'left'],
      ['claims', 'Claims', 'right'],
      ['open', 'Open', 'right'],
      ['damage', 'Damage or loss', 'right'],
      ['late', 'Late or not delivered', 'right'],
      ['wrong', 'Wrong item or qty', 'right'],
      ['account', 'Shipping account or address', 'right'],
      ['freight', 'Freight or packaging', 'right'],
      ['none', 'Not a carrier fault', 'right'],
      ['credit', 'Credit', 'right'],
      ['p90', 'Slowest 10% closed in', 'right']
    ];
    // Why each reason is counted the way it is, read off the same wording the
    // build matches on. Without this the six columns are six bare nouns and the
    // boundary between "late" and "lost" - the one a reader is most likely to
    // query - is invisible.
    const CARRIER_WHY = {
      damage: 'Arrived broken, or went missing in the network',
      late: 'Did not ship, deliver or arrive when it was promised',
      wrong: 'Wrong goods, or the wrong quantity of them',
      account: 'Wrong shipping account, method, label or address',
      freight: 'Freight or packaging calculated or applied wrongly',
      none: 'Names a courier, but the stated reason is not one of the courier\'s'
    };
    function carrierTable(cf) {
      if (!cf.length) {
        return '<p class="mu" style="margin:14px 0 4px">No claim in ' + esc(String(year)) +
          ' names a carrier in its department, type or description.</p>';
      }
      const maxC = Math.max(...cf.map((c) => c[1]), 1);
      const maxV = Math.max(...cf.map((c) => c[5]), 1);
      const dir = carDir;
      const ki = CARRIER_KEY[carSort];
      const sorted = cf.slice().sort((a, b) =>
        carSort === 'name' ? dir * String(a[0]).localeCompare(String(b[0])) : dir * (a[ki] - b[ki])
      );
      const th = (k, label, align) => {
        const on = carSort === k;
        return `<th class="${align === 'right' ? 'r' : 'l'}${on ? ' on' : ''}" style="text-align:${align}" aria-sort="${on ? (dir === -1 ? 'descending' : 'ascending') : 'none'}"${CARRIER_WHY[k] ? ` title="${esc(CARRIER_WHY[k])}"` : ''}>` +
          `<button type="button" onclick="setCarSort('${k}')">${esc(label)}` +
          `<span class="car">${on ? (dir === -1 ? '&#8595;' : '&#8593;') : ''}</span></button></th>`;
      };
      // A reason cell is a count and its share of the carrier's claims. The
      // remainder column is printed thin so it reads as "what is left over"
      // rather than as a sixth kind of courier failure.
      const reasonCell = (k, n, claims) =>
        `<td class="n rs"><b${k === 'none' ? ' class="thin"' : ''}>${num(n)}</b><span class="mu" style="font-size:11px">${pct(n, claims)}</span></td>`;
      const body = sorted.map((c) => {
        const [name, claims, orders, open, openCredit, credit, damage, med, p90, timed] = c;
        const both = name === 'UPS/FedEx';
        const openRate = pnum(open, claims);
        const tip = `${claims} claims against ${orders} orders · ${pct(open, claims)} still open` +
          (both ? ' · names both carriers in the same claim, so it is not filed under either' : '');
        // The reason split in the tooltip, so hovering a row answers "which of
        // these is the courier's fault" without reading six columns across.
        const whyTip = CARRIER_COLS
          .filter(([k]) => CARRIER_WHY[k])
          .map(([k]) => `${CARRIER_COLS.find(([kk]) => kk === k)[1]} ${num(c[CARRIER_KEY[k]])}`)
          .join(' · ');
        return `<tr onclick="openSlice('ca','${esc(name)}')" tabindex="0"
            onkeydown="if(event.key==='Enter'||event.key===' '){openSlice('ca','${esc(name)}');return false}"
            title="${esc(tip + ' · ' + whyTip)}">
          <td class="name">${esc(name)}${both ? ' <span class="mu" style="font-size:11px">(both named)</span>' : ''}</td>
          <td class="n"><b>${num(claims)}</b><span class="mb"><i style="width:${pnum(claims, maxC).toFixed(1)}%"></i></span></td>
          <td class="n"><b>${num(open)}</b><span class="mu" style="font-size:11px">${openRate.toFixed(1)}%</span>
            <span class="mb"><i style="width:${Math.min(100, openRate).toFixed(1)}%"></i></span></td>
          ${CARRIER_COLS.filter(([k]) => CARRIER_WHY[k]).map(([k]) => reasonCell(k, c[CARRIER_KEY[k]], claims)).join('')}
          <td class="n"><b>${usd(credit)}</b><span class="mb"><i style="width:${pnum(credit, maxV).toFixed(1)}%"></i></span></td>
          <td class="n"><b>${timed ? p90.toFixed(1) + 'd' : '—'}</b><span class="mu" style="font-size:11px">${timed ? 'median ' + med.toFixed(1) + 'd' : 'no closed claims'}</span></td>
        </tr>`;
      }).join('');
      return `<div class="tw" style="border:0;margin-top:4px"><table class="ctable">
          <thead><tr>${CARRIER_COLS.map(([k, l, a]) => th(k, l, a)).join('')}</tr></thead>
          <tbody>${body}</tbody>
        </table></div>`;
    }

    // The scale is set by the tallest single MONTH, not by the annual total, and
    // rounded to a readable step so the line is read against round numbers.
    function niceScale(raw, steps) {
      const s = steps || 4;
      const rough = Math.max(raw, 1) / s;
      const mag = Math.pow(10, Math.floor(Math.log10(rough)));
      const norm = rough / mag;
      const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
      return { step, top: step * s };
    }

    // Two series over one shared month axis, drawn as lines.
    // This was twelve pairs of bars, which answers "is this month bigger than
    // last month" and leaves "which way is the year heading" to the reader: with
    // paired bars every month is a separate comparison and none of them join up.
    // Joining them is the whole point of the comparison, so last year is a
    // dashed line behind this year's solid one and the eye can follow both.
    //
    // The bars carried their own value on every column, which is why they needed
    // no y-axis. A line cannot do that - the value belongs to the point, not to a
    // column - so the scale comes back, with gridlines and the month-over-month
    // change under each month so no readout is lost.
    //
    // The axis always runs the full twelve months so the two years sit on the
    // same calendar and last year's whole shape is visible. The current year is a
    // part year, so its line simply stops where its data stops and the months
    // beyond are shaded: truncating the axis instead would hide that last year
    // ran on past the point this year reached.
    //
    // Ticks, month names and the per-month delta are all drawn in SVG rather than
    // in sibling HTML so they stay registered to the plotted points at any width.
    const TL = { w: 340, h: 190, l: 40, r: 6, t: 10, b: 30 };
    function trendline(cells, top, step, tick, tip) {
      const n = cells.length;
      const pw = TL.w - TL.l - TL.r;
      const ph = TL.h - TL.t - TL.b;
      const base = TL.t + ph;
      const x = (i) => +(n > 1 ? TL.l + (i * pw) / (n - 1) : TL.l + pw / 2).toFixed(1);
      const y = (v) => +(base - (v / top) * ph).toFixed(1);
      const pts = (key, src) => src.map((d, i) => `${x(i)},${y(d[key])}`).join(' ');

      // Where this year's data ends. The missing months are always the tail, so
      // one pass for the first gap is enough.
      const gap = cells.findIndex((d) => d.c === null);
      const cut = gap === -1 ? n : gap;

      // Shaded first, so it sits under the gridlines and both lines.
      let band = '';
      if (cut < n && n > 1) {
        const from = x(cut - 1);
        const wide = +(TL.w - TL.r - from).toFixed(1);
        const mid = +(from + (TL.w - TL.r) / 2).toFixed(1);
        band = `<rect class="gap" x="${from}" y="${TL.t}" width="${wide}" height="${ph}"/>` +
          '';
      }

      const grid = [];
      for (let v = 0; v <= top + step / 2; v += step) {
        const edge = v === 0;
        grid.push(`<line class="gl${edge ? ' base' : ''}" x1="${TL.l}" y1="${y(v)}" x2="${TL.w - TL.r}" y2="${y(v)}"/>`);
        grid.push(`<text class="tk" x="${TL.l - 6}" y="${y(v)}" text-anchor="end" dominant-baseline="middle">${tick(v)}</text>`);
      }

      const dots = [['c', cells.slice(0, cut)], ['p', cells]].map(([key, src]) => src.map((d, i) => {
        const v = d[key];
        return `<circle class="pt" cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${key === 'c' ? '#6366f1' : '#b3a49b'}">` +
          `<title>${d.m} ${key === 'c' ? year : year - 1}: ${tip(v)}</title></circle>`;
      }).join('')).join('');

      const foot = cells.map((d, i) => {
        const mo = `<text class="mo" x="${x(i)}" y="${base + 12}" text-anchor="middle">${d.m}</text>`;
        if (d.c === null) return mo;
        const pc = d.p ? ((d.c - d.p) / d.p) * 100 : d.c ? 100 : 0;
        const cls = pc > 0.5 ? 'up' : pc < -0.5 ? 'dn' : 'fl';
        const txt = Math.abs(pc) < 0.5 ? '0%' : (pc > 0 ? '+' : '−') + Math.abs(pc).toFixed(0) + '%';
        return mo + `<text class="dl ${cls}" x="${x(i)}" y="${base + 23}" text-anchor="middle">${txt}</text>`;
      }).join('');

      return (
        `<svg class="trend" viewBox="0 0 ${TL.w} ${TL.h}" width="100%" role="img" aria-label="Monthly trend, this year against last year">` +
        `${band}${grid.join('')}` +
        `<polyline class="pv" points="${pts('p', cells)}"/>` +
        `<polyline class="cu" points="${pts('c', cells.slice(0, cut))}"/>` +
        `${dots}${foot}</svg>`
      );
    }

    // months[i] = [claimCount, credit]. vi picks which one is plotted, so the
    // credit chart plots credit rather than counts wearing a dollar sign. tick
    // formats the axis, tip formats the hover value.
    //
    // The axis is always twelve months but this year only has `had` of them, so
    // the rest are null rather than zero - a zero would say the month was
    // measured and came out empty, which is a different and wrong claim.
    function monthCompare(had, f, tick, vi) {
      const a = upTo(PREV, had), b = upTo(S, had);
      const k = vi || 0;
      const cells = MONTHS.map((m, i) => ({
        m,
        p: PREV.months[i] ? PREV.months[i][k] : 0,
        c: i < had && S.months[i] ? S.months[i][k] : null
      }));
      const seen = cells.flatMap((d) => [d.p, d.c].filter((v) => v !== null));
      const { step, top } = niceScale(seen.length ? Math.max(...seen) : 1);
      const tail = MONTHS.length > had;
      return (
        `<div class="mchart">` +
        trendline(cells, top, step, tick, f) +
        `<div class="mctot">
            <span>${tail ? `${MONTHS[0]}–${MONTHS[had - 1]} vs full year` : `${had} months`}</span>
            <span><i style="background:#b3a49b"></i>${year - 1} <b>${f(k ? a.v : a.c)}</b></span>
            <span><i style="background:#6366f1"></i>${year} <b>${f(k ? b.v : b.c)}</b></span>
            <span class="mgd ${(k ? b.v : b.c) > (k ? a.v : a.c) ? 'up' : 'dn'}">${(k ? b.v : b.c) > (k ? a.v : a.c) ? '+' : '−'}${Math.abs((((k ? b.v : b.c) - (k ? a.v : a.c)) / ((k ? a.v : a.c) || 1)) * 100).toFixed(1)}%</span>
          </div>
        </div>`
      );
    }

    // Bar height scales to the same figure printed above the bar, so the
    // tallest bar is always the largest number. It used to scale the height by
    // claim COUNT while the label showed credit, which put the biggest figure
    // on the shortest bar: in 2026 '>$500' carried $290,313 but only 228 claims,
    // so it drew as the smallest bar while '<$50' drew as the largest.
    //
    // Heights are a percentage of the .vb box, not pixels. The old code fed the
    // output of pnum() - which returns 0-100 - into a px value, capping the
    // tallest bar at 100px inside a 150px box and leaving it squashed.
    //
    // BAR_MAX is the share of the box the tallest bar may take; the remainder is
    // left free for the value and the band name so neither overflows. 70 leaves
    // enough headroom for the band name to wrap to two lines on a narrow screen.
    const BAR_MAX = 70;

    function vbarFixed(data, valueIdx, f) {
      const val = (d) => Math.abs(d[valueIdx] || 0);
      // peak is the real maximum, kept separate from max: max carries a floor of
      // 1 so a divide-by-zero cannot happen when every value is 0, but it must
      // not decide who wins, or an all-zero chart would crown an arbitrary bar.
      const peak = Math.max(...data.map(val));
      const max = Math.max(peak, 1);
      // Every bar holding the peak is drawn red, so a tie never crowns an
      // arbitrary winner.
      const isTop = (d) => peak > 0 && val(d) === peak;
      return (
        `<div class="vb">` +
        data.map((d) => {
          const h = Math.max(2, (val(d) / max) * BAR_MAX).toFixed(1);
          const bar = isTop(d) ? ' class="top"' : '';
          return `<div><em>${f(d[valueIdx])}</em>` +
            `<span${bar} style="height:${h}%"></span><label>${esc(d[0])}</label></div>`;
        }).join('') +
        `</div>`
      );
    }

    function line(a, b, label, unit) {
      const all = [...a, ...b].filter((v) => v > 0);
      const max = all.length ? Math.max(...all) : 1;
      const x = (i) => 20 + (i * 300) / 11;
      const y = (v) => 110 - (v / max) * 95;
      const points = (v) => v.map((val, i) => `${x(i)},${y(val)}`).join(' ');

      const dots = [b, a].map((series, k) => series.map((val, i) =>
        val > 0
          ? `<circle cx="${x(i)}" cy="${y(val)}" r="2.5" class="pt" fill="${k ? '#6366f1' : '#b3a49b'}">` +
            `<title>${MONTHS[i]} ${k ? year : year - 1}: ${unit === 'k' ? usd(val * 1000) : num(val)}</title></circle>`
          : ''
      ).join('')).join('');

      const labels = MONTHS.map((m, i) => `<text x="${x(i)}" y="126" font-size="8" text-anchor="middle" fill="#8fa69a">${m}</text>`).join('');

      return (
        `<svg class="trend" viewBox="0 0 340 130" width="100%" role="img" aria-label="${label}">` +
        `<polyline points="${points(b)}" fill="none" stroke="#b3a49b" stroke-width="2" stroke-dasharray="4 3"/>` +
        `<polyline points="${points(a)}" fill="none" stroke="#6366f1" stroke-width="2.5"/>` +
        `${dots}${labels}</svg>` +
        `<div class="legend row">` +
        `<span><i style="background:#6366f1"></i> ${year}</span>` +
        `<span><i style="background:#b3a49b"></i> ${year - 1}</span>` +
        `<span>${label}</span></div>`
      );
    }

    function fmt(key, n) {
      return metric[key] === 'value' ? usd(n) : num(n);
    }
    const isMoney = (k) => metric[k] === 'value';

    function seg(key, on, off) {
      return (
        `<div class="seg" role="group">` +
        `<button type="button" class="${isMoney(key) ? '' : 'on'}" aria-pressed="${!isMoney(key)}" onclick="setMetric('${key}')">${on}</button>` +
        `<button type="button" class="${isMoney(key) ? 'on' : ''}" aria-pressed="${isMoney(key)}" onclick="setMetric('${key}')">${off}</button>` +
        `</div>`
      );
    }
    function setMetric(key) { metric[key] = isMoney(key) ? 'count' : 'value'; render(); }
    function setYear(y) { year = y; typesExpanded = false; render(); }
    function toggleTypes() { typesExpanded = !typesExpanded; render(); }
    function setDeptMoney(m) { deptMoney = m; render(); }
    function setCarSort(k) {
      if (carSort === k) carDir = -carDir;
      else { carSort = k; carDir = k === 'name' ? 1 : -1; }
      render();
    }

    // Clicking the column you are already sorted on flips the direction, which is
    // what a reader expects from a sortable header. A new column starts in the
    // useful direction: names A-Z, measures largest first.
    function setDeptSort(k) {
      if (deptSort === k) deptDir = -deptDir;
      else { deptSort = k; deptDir = k === 'dept' ? 1 : -1; }
      render();
    }

    // Where "View in table" goes. Claims are listed on claims.html, so a card that
    // names a population deep-links into that page with the population already
    // applied, rather than filtering a table that used to live here. The query is
    // built from claims.html's own filter keys - the same keys its toolbar writes -
    // so the link and the page cannot disagree about what a scenario is.
    function claimsHref(q) {
      const p = new URLSearchParams();
      Object.keys(q).forEach((k) => { if (q[k]) p.set(k, q[k]); });
      return 'claims.html?' + p.toString();
    }

    // The card's table link, or nothing. A card with no scenario the claims table
    // can express says so and offers no link at all, rather than opening the whole
    // table behind a label implying the link had narrowed anything.
    function cardLink(a) {
      const l = a.link;
      if (!l) return '';
      const href = l.page || claimsHref(l.q || {});
      return `<a class="ac-view" href="${href}">${esc(l.label)} &#8599;</a>`;
    }

    // Reporting-year dropdown, same open/close behaviour as the nav menu.
    function yearMenu(btn) {
      const dd = btn.closest('.dropdown');
      const open = !dd.classList.contains('open');
      document.querySelectorAll('.dropdown.open').forEach((o) => {
        o.classList.remove('open');
        o.querySelector('button')?.setAttribute('aria-expanded', 'false');
      });
      dd.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
      return false;
    }

    // ---------- the panel: one prioritised feed ----------
    // A single list, sorted by how urgent each item is. Where the card came from
    // no longer decides where it sits: an AI-detected pattern and a plain metric
    // are interleaved by priority, because a standing fault and a queue of
    // unfinished entries are both just work. The origin is still carried, but
    // only as a label on the card, so a reader can tell what to investigate from
    // what to work through.
    //   prio - 1 Do First, 2 Do Next, 3 Review. The only sort key that matters.
    //   w    - weight, breaks ties inside a priority tier.
    //   src  - 'ai' or 'metric'; drives the source tag and nothing else.
    //   kind/value - the population the card is about, matched against the open
    //          queue so the pop-up can say who is in it.
    //   go   - the verb on the card. It opens the card's pop-up, so the verb
    //          names what the reader is about to be shown.
    //   why  - one sentence on how the headline number was measured. The card has
    //          room for a count and a context line only; this is what turns the
    //          count into something the reader can check, and it lives in the
    //          pop-up rather than on the card so the grid stays one line per card.
    //   link - optional { label, q } for the claims table, or { label, page } to
    //          point somewhere else. Absent where the claims table cannot express
    //          the scenario, because a link that opens everything is a lie.
    //   noTable - why there is no link, for the pop-up's footer to state. Better a
    //          sentence the reader can check than a control that leads somewhere
    //          the label does not describe.
    // Whole-year totals (total raised, resolved) are deliberately absent: they
    // have no filter to open and nothing to pick up, so they live in the KPI
    // tiles once rather than sitting in a priority queue.
    const PRIO = { 1: ['Do First', 'p1'], 2: ['Do Next', 'p2'], 3: ['Review', 'p3'] };
    const SRC = { ai: ['AI Insight', 'sai'], metric: ['Metric', 'smetric'] };

    // Four insights, all measured off S.typeMonths (the top 12 claim types by
    // yearly count, each with its 12 monthly counts) plus the scoped year block.
    function aiFindings() {
      const out = [];
      const n = monthsSoFar();
      const series = (S.typeMonths || []).map(([t, ms]) => ({
        t, ms,
        inMonths: ms.slice(0, n).filter((v) => v > 0).length,
        total: ms.slice(0, n).reduce((a, b) => a + b, 0)
      }));
      const creditOf = (t) => (S.types.find((x) => x[0] === t) || [, 0, 0])[2];
      // S.types is ordered by count, not money. Ranking it again by credit is
      // what makes "high-value" mean valuable rather than merely frequent.
      const byValue = S.types.filter((t) => t[0] !== '(Unclassified)' && t[2] > 0).slice().sort((a, b) => b[2] - a[2]);
      const real = series.filter((s) => s.t !== '(Unclassified)');

      // Every insight claims a claim type, and once one has been used the next
      // card moves to the next best candidate. Otherwise all four cards end up
      // describing the same dominant type, which tells the reader nothing.
      const used = new Set();
      const claim = (cands) => {
        const pick = cands.find((t) => !used.has(t));
        if (pick) used.add(pick);
        return pick;
      };

      // 1. Recurring issue - the type that turns up in every single month, so it
      // is a standing fault rather than a one-off. `real` is simply every type
      // in the series: the untyped claims never reach S.typeMonths, so there is
      // no "no claim type" bucket competing with real faults here.
      const chronic = real.filter((s) => s.inMonths === n && n >= 3 && s.total > 0);
      const topChronic = claim(chronic.map((s) => s.t));

      if (topChronic) {
        const c = chronic.find((s) => s.t === topChronic);
        out.push({
          src: 'ai', prio: 1, w: 1, n: c.total, kind: 'ty', value: c.t,
          label: 'Recurring issue',
          v: `${c.t} in ${c.inMonths} of ${n} months · ${usd(creditOf(c.t))} credit`,
          go: 'Investigate pattern',
          why: `Every claim of this type raised in ${year}, counted off the monthly series. It appears in all ${c.inMonths} months the year has run to, which is what separates a standing fault from a one-off incident - a type that turned up in three months and then stopped would not qualify.`,
          link: { label: 'View in table', q: { ty: c.t } }
        });
      }

      // 2. High-value impact - the claim type carrying the most money, which is
      // where cutting volume pays off fastest. Measured on credit, not count.
      const topValue = claim(byValue.map((t) => t[0]));
      if (topValue) {
        const t = byValue.find((x) => x[0] === topValue);
        out.push({
          src: 'ai', prio: 2, w: 4, n: t[1], kind: 'ty', value: t[0],
          label: 'High-value impact',
          v: `${t[0]} · ${usd(t[2])} · ${pct(t[2], S.credit)} of credit`,
          go: 'Investigate pattern',
          why: `The claim type carrying the most credit in ${year}, after ranking the whole year by money rather than by count - the type list is sorted by volume, so re-ranking it is what makes "high value" mean valuable instead of merely frequent. The number on the card is its claim count; the money is why it is here.`,
          link: { label: 'View in table', q: { ty: t[0] } }
        });
      }

      // 3. Emerging trend - the type whose last three months run well above its
      // first three. The floor stops a 3 -> 9 a month wobble on 20 claims from
      // being dressed up as a trend.
      const growers = real
        .filter((s) => n >= 6 && s.total >= 40)
        .map((s) => {
          const ms = s.ms.slice(0, n);
          const head = ms.slice(0, 3).reduce((a, b) => a + b, 0) / 3;
          const tail = ms.slice(-3).reduce((a, b) => a + b, 0) / 3;
          return { ...s, head, tail, ratio: head ? tail / head : tail ? 9 : 0 };
        })
        .filter((s) => s.ratio >= 1.5 && s.tail >= 4)
        .sort((a, b) => b.ratio - a.ratio);
      const topGrower = claim(growers.map((s) => s.t));
      if (topGrower) {
        const g = growers.find((s) => s.t === topGrower);
        out.push({
          src: 'ai', prio: 3, w: 7, n: g.total, kind: 'ty', value: g.t,
          label: 'Emerging trend',
          v: `${g.t} · ${g.head.toFixed(0)} → ${g.tail.toFixed(0)} a month · ${usd(creditOf(g.t))} credit`,
          go: 'Investigate pattern',
          why: `The type whose last three months average at least 1.5x its first three, on at least ${num(g.total)} claims for the year and at least ${g.tail.toFixed(0)} a month at the tail. Both floors are load-bearing: without them a 3 → 9 a month wobble across twenty claims gets dressed up as a trend.`,
          link: { label: 'View in table', q: { ty: g.t } }
        });
      }

      // 4. Potential CAPA - where a corrective action is most obviously owed.
      // Nothing in this file has a corrective action recorded against it, so
      // the card points at the type with the largest pile of unfinished open
      // claims and states how few claims carry one. It is a prompt to act, not
      // a claim that a cause is already known.
      const byOpen = {};
      queue().forEach((r) => { byOpen[r.ty || '(Unclassified)'] = (byOpen[r.ty || '(Unclassified)'] || 0) + 1; });
      // Deliberately not routed through claim(): the queue only holds listed
      // claims, so the biggest open pile is a real type, and counting it twice
      // through claim()'s de-duplication would hand the card to whatever has
      // not been described yet rather than to whatever is heaviest.
      const topOpen = Object.keys(byOpen).sort((a, b) => byOpen[b] - byOpen[a])[0];
      if (topOpen) {
        out.push({
          src: 'ai', prio: 2, w: 5, n: byOpen[topOpen], kind: 'ty', value: topOpen,
          label: 'Potential CAPA',
          v: `${topOpen} is the biggest open pile · ${num(S.capaFilled)} of ${num(S.total)} carry a corrective action`,
          go: 'Start CAPA review',
          why: `The claim type holding the largest pile of claims that still need work in ${year}. It is a prompt to start a corrective action, not a finding that a cause is already known: nothing in this export records one, and the pop-up says how few claims carry any at all.`,
          link: { label: 'View in table', q: { ty: topOpen } }
        });
      }

      return out;
    }
// The metric half of the feed. Each count is read off the same stats block every
    // other figure on the page uses, so the feed and the figures in the stat line
    // cannot disagree. Weight only matters inside a priority tier, and matches
    // where the same item used to sit in reading order.
    function buildActions() {
      const out = [];

      const add = (o) => { if (o.n > 0) out.push(o); };

      add({
        src: 'metric', prio: 1, w: 3, n: S.unfinished, kind: 'reason', value: 'Entry not finished',
        label: 'Awaiting action',
        v: `${pct(S.unfinished, S.total)} of intake · entry not marked finished`,
        go: 'Review entries',
        why: `Claims raised in ${year} whose ClaimEntryFinished field is not 1 - somebody opened the entry and did not close it out. It counts the whole year rather than only what is still open, so a claim closed since still shows up here.`,
        // Deliberately no table link. The flag this card counts has no column on
        // claims.html, and the nearest thing there - status Open - is a different
        // population, because a resolved claim can still carry an unfinished entry.
        // A link to the wrong population is worse than no link.
        noTable: 'The claims table has no column for entry-not-finished, and status Open is a different set, so there is nothing there to link to.'
      });

      add({
        src: 'metric', prio: 2, w: 6, n: S.repeatClaims, kind: 'reason', value: 'Repeat-claim order',
        label: 'Repeat-claim orders',
        v: `${num(S.repeatOrders)} orders hit twice · ${usd(S.repeatCredit)} credit`,
        go: 'Review orders',
        why: `Claims raised in ${year} against an OrderID that raised more than one claim anywhere in the whole 2010-2026 file, not just this year - so an order claimed against in two different years still counts. A repeat claim is usually one problem entered twice.`,
        link: { label: 'View orders', page: 'orders.html' }
      });

      return aiFindings().concat(out).sort((a, b) => a.prio - b.prio || a.w - b.w);
    }

    // Every card is the same seven-part shape regardless of origin: priority tag,
    // source tag, headline number, label, one line of context, one verb and one
    // table link. The flex column plus margin-top:auto on the action row keeps
    // every row of actions on the same baseline, which a fixed structure is what
    // buys you.
    //
    // The card is a div, not an anchor, because a card carries a second control -
    // the link out to the claims table - and a link inside an anchor is not valid
    // HTML and is not reliably clickable. The stretched ::after on .ac-jump keeps
    // the whole card clickable for the pop-up; the action row sits above it on its
    // own z-index.
    //
    // The verb is the pop-up and the table link is the way out of it: a reader who
    // wants the rows gets the rows, and a reader who wants to understand the number
    // gets it without losing their place on the page. n is the card's position in
    // the feed, which is the same array buildActions() returns here, so the pop-up
    // and the card cannot end up describing different things.
    const actCard = (a, n) => {
      const [pLabel, pCls] = PRIO[a.prio];
      const [sLabel, sCls] = SRC[a.src];
      return `<div class="card ncard ${pCls}">
          <a class="ac-jump" href="#" onclick="openCard(${n});return false">
            <span class="tags"><span class="tag ${pCls}">${pLabel}</span><span class="tag ${sCls}">${sLabel}</span></span>
            <b class="ac-n">${num(a.n)}</b>
            <span class="ac-label">${esc(a.label)}</span>
            <span class="ac-v">${esc(a.v)}</span>
          </a>
          <div class="ac-act">
            <span class="go">${esc(a.go)} &#8594;</span>
            ${cardLink(a)}
          </div>
        </div>`;
    };

    // One grid, one sort. Two headers that used to sit here are both gone. The
    // first split AI cards from metric cards, which the feed no longer
    // distinguishes in its ordering. The second was a legend for the three
    // priority tiers, which every card already labels for itself.
    function renderFindings() {
      const all = buildActions();
      if (!all.length) return '<p class="mu">Nothing outstanding this year.</p>';
      // Nothing sits above the grid any more. That row carried the priority-tier
      // legend first, then the card count once the legend was removed - a key to
      // three tiers that every card already labels for itself, followed by a
      // count of the cards directly below it. The tier still decides the sort
      // order; that behaviour is untouched.
      return `<div class="grid g3">${all.map(actCard).join('')}</div>`;
    }

// ---------- the detail pop-up ----------
    // A card prints one number and one line of context. This is where the rest
    // lives: how the number was measured, how it sits against the rest of the
    // year, and which slices make it up. Every figure is read off the same stats
    // block and the same scoped queue the card itself was built from, so the
    // pop-up cannot drift away from the card that opened it.
    //
    // The frame - scrim, scroll lock, Escape - lives in app.js, as one shell for
    // the whole app. What goes inside it is this page's.

    // The open claims behind one card. The queue is the set of claims that still
    // needs work, already cut to the year and to the reader, so it is the honest
    // answer to "who is in this" - and it is a subset of the card's own number,
    // not the same thing: the card counts the whole year, the queue only what is
    // still open. The pop-up states both, so the two cannot read as one figure.
    function sliceRows(a) {
      const q = queue();
      if (a.kind === 'reason') return q.filter((r) => r.reasons.includes(a.value));
      return q.filter((r) => r[a.kind] === a.value);
    }

    // [label, count] pairs, biggest first. Ties break on the name so two opens of
    // the same card come back in the same order.
    function tally(rows, f) {
      const m = new Map();
      rows.forEach((r) => { const k = f(r); m.set(k, (m.get(k) || 0) + 1); });
      return [...m.entries()].sort((x, y) => y[1] - x[1] || String(x[0]).localeCompare(String(y[0])));
    }

    // A titled block of top-N composition bars. The bar is scaled to the largest
    // row rather than to the total: the question a top-five list answers is "which
    // one is the biggest", and a bar measured against the total renders every row
    // of a long-tailed list as the same sliver.
    function popGroup(title, rows, limit) {
      const list = rows.slice(0, limit || 5);
      if (!list.length) return '';
      const top = list[0][1];
      return `<div class="mdl-grp"><h4>${esc(title)}</h4>` +
        list.map(([k, n]) => `
          <div class="mdl-row">
            <div class="lbl" title="${esc(k)}">${esc(k)}</div>
            <div class="bar"><i style="width:${pnum(n, top).toFixed(1)}%"></i></div>
            <b>${num(n)}</b>
          </div>`).join('') +
        (rows.length > list.length
          ? `<div class="mu" style="font-size:11.5px;margin-top:6px">and ${num(rows.length - list.length)} more</div>`
          : '') +
        '</div>';
    }

    function popFacts(rows) {
      return `<dl class="mdl-facts">` + rows
        .map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`)
        .join('') + '</dl>';
    }

    // One footer for every pop-up on this page: the way out to the rows, if the
    // claims table can express this scenario, and a plain Close. A card with no
    // honest scenario says so in words instead of shipping a link that would open
    // the whole table behind a label implying it had narrowed anything.
    function popFoot(link, why) {
      return `<div class="mdl-ft">
          ${link ? `<a class="btn s p" href="${link.href}">${esc(link.label)} &#8599;</a>` : ''}
          <button class="btn s" type="button" onclick="closeModal()">Close</button>
          <div class="sp"></div>
          ${link ? '' : `<span class="mu">${esc(why || 'Nothing on the claims table filters to this one.')}</span>`}
        </div>`;
    }

    // Everything a card has no room for. Assembled per card rather than laid out
    // generically, because a claim-type card is about money and months while an
    // unfinished-entry card is about departments and which claim types are piling
    // up - one fixed figure set for both would have to drop whichever set the card
    // happened not to need.
    function cardDetail(a) {
      const rows = sliceRows(a);
      const facts = [];
      let groups = '';

      if (a.kind === 'ty') {
        const t = S.types.find((x) => x[0] === a.value) || [a.value, 0, 0];
        const ms = (S.typeMonths || []).find((x) => x[0] === a.value);
        const n = monthsSoFar();
        const inMonths = ms ? ms[1].slice(0, n).filter((v) => v > 0).length : 0;
        facts.push(['Claims', num(t[1])]);
        facts.push(['Credit', usd(t[2])]);
        facts.push(["Of the year's claims", pct(t[1], S.total)]);
        facts.push(["Of the year's credit", pct(t[2], S.credit)]);
        facts.push(['Months it appears', `${inMonths} of ${n}`]);
        facts.push(['Still open', `${num(rows.length)} · ${pct(rows.length, t[1])}`]);
        if (ms) groups += popGroup('Claims per month', ms[1].slice(0, n).map((v, i) => [MONTHS[i], v]).filter((e) => e[1] > 0), 12);
        groups += popGroup('Departments with it open', tally(rows, (r) => r.de));
        groups += popGroup('Owners holding it', tally(rows, (r) => r.own).map(([id, c]) => [ownerName(id), c]));
      } else {
        facts.push(['Claims', num(a.n)]);
        facts.push(["Of the year's intake", pct(a.n, S.total)]);
        facts.push(['Still open', num(rows.length)]);
        facts.push(['Departments involved', num(new Set(rows.map((r) => r.de)).size)]);
        facts.push(['Claim types involved', num(new Set(rows.map((r) => r.ty)).size)]);
        facts.push(['Credit on the open ones', usd(rows.reduce((s, r) => s + (r.am || 0), 0))]);
        if (a.value === 'Repeat-claim order') {
          facts.push(['Orders hit more than once', num(S.repeatOrders)]);
          groups += popGroup('Worst-hit orders', tally(rows.filter((r) => r.o), (r) => r.o));
        }
        groups += popGroup('Departments', tally(rows, (r) => r.de));
        groups += popGroup('Claim types', tally(rows, (r) => r.ty));
      }

      const [pLabel, pCls] = PRIO[a.prio];
      const [sLabel, sCls] = SRC[a.src];
      const link = a.link ? { label: a.link.label, href: a.link.page || claimsHref(a.link.q || {}) } : null;

      return `
        <div class="mdl-hd">
          <div class="mdl-n">
            <span class="tags" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px"><span class="tag ${pCls}">${pLabel}</span><span class="tag ${sCls}">${sLabel}</span></span>
            <h3 id="mdl-t">${esc(a.label)}</h3>
            <span class="mdl-sub">${esc(a.v)}</span>
          </div>
          <button class="mdl-x" type="button" onclick="closeModal()" aria-label="Close">&#215;</button>
        </div>
        <div class="mdl-bd">
          <p class="mdl-why">${esc(a.why)}</p>
          ${popFacts(facts)}
          ${groups || '<p class="mu" style="font-size:12px">Nothing on this is open any more, so there is nothing to break down.</p>'}
        </div>
        ${popFoot(link, a.noTable)}`;
    }

    function openCard(i) {
      const a = buildActions()[i];
      if (a) openModal(cardDetail(a));
    }

    // A department or a carrier row, in the same pop-up. Both tables used to hand
    // off to the open-claims table, which no longer lives on this page, so a row
    // that silently did nothing would be worse than not offering the interaction at
    // all. The figures come from the same rows the two tables above are built from,
    // so the pop-up is a re-reading of the row and not a second source.
    //
    // A department has a scenario the claims table can express and a carrier has
    // none - the export has no Carrier column, so the courier is read out of the
    // department, type and description and there is nothing on claims.html to
    // filter it by. That row says so rather than linking somewhere that shows
    // something else.
    function openSlice(kind, value) {
      const isDept = kind === 'de';
      const d = (isDept ? deptFacts() : carrierFacts()).find((x) => x[0] === value);
      const rows = queue().filter((r) => (isDept ? r.de : r.ca) === value);
      const facts = isDept && d
        ? [
            ['Claims raised', num(d[3])],
            ['Credit', usd(d[6])],
            ['Orders', num(d[4])],
            ['Still open', `${num(d[5])} · ${pct(d[5], d[3])}`],
            ['Repeat orders', num(d[9])],
            ['Credit per claim', usd(d[3] ? d[6] / d[3] : 0)]
          ]
        : d
        ? [
            ['Claims', num(d[1])],
            ['Credit', usd(d[5])],
            ['Orders', num(d[2])],
            ['Still open', `${num(d[3])} · ${pct(d[3], d[1])}`],
            ['Slowest 10% closed in', d[9] ? d[8].toFixed(1) + 'd' : '—'],
            ['Median close', d[9] ? d[7].toFixed(1) + 'd' : '—']
          ]
        : [];

      const why = isDept
        ? `Every claim raised in ${year} from this department, off the same row the comparison table above is built from. Still open is this year's open-claim queue narrowed to it, so it counts denied and cancelled entries as well as unresolved ones.`
        : `The export has no Carrier column, so this is counted out of the department, claim type and description. The six reason columns in the scorecard partition these claims - each one lands on exactly one reason or on "not a carrier fault" - which is why they add up to the claim count rather than exceeding it.`;

      return openModal(`
        <div class="mdl-hd">
          <div class="mdl-n">
            <span class="tags" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:7px"><span class="tag smetric">${isDept ? 'Department' : 'Carrier'}</span></span>
            <h3 id="mdl-t">${esc(value)}</h3>
            <span class="mdl-sub">${num(d ? (isDept ? d[3] : d[1]) : rows.length)} claims in ${esc(String(year))} · ${num(rows.length)} still open</span>
          </div>
          <button class="mdl-x" type="button" onclick="closeModal()" aria-label="Close">&#215;</button>
        </div>
        <div class="mdl-bd">
          <p class="mdl-why">${esc(why)}</p>
          ${facts.length ? popFacts(facts) : ''}
          ${popGroup('Departments', tally(rows, (r) => r.de))}
          ${popGroup('Claim types', tally(rows, (r) => r.ty))}
        </div>
        ${popFoot(isDept ? { label: 'View in table', href: claimsHref({ de: value }) } : null,
          isDept ? '' : 'A carrier is not a field on the claims table, so there is nothing to filter to.')}`);
    }

    // ---------- render ----------
    function render() {
      S = stats(year);
      PREV = stats(year - 1);
      const df = deptFacts();
      const cf = carrierFacts();
      const n = monthsSoFar();
      const cur = upTo(S, n), prev = upTo(PREV, n);
      const dClaims = delta(cur.c, prev.c);
      const dCredit = delta(cur.v, prev.v);
      const typesShown = typesExpanded ? S.types : S.types.slice(0, TYPES_TOP);

      // The stat line under the page title. Plain sentences, not pills: a red or
      // green badge states a verdict, and on these three lines "up" is not one
      // thing - more claims raised is neutral, more credit given is bad, and
      // fewer open claims is good. The glyph carries the direction, the text
      // carries the number.
      // Claims and credit are compared over the same number of months in both
      // years (see monthsSoFar), because 9 months against 12 is not a trend.
      // Still open has no like-for-like series to compare against - the data is
      // a full-year block, not a monthly one - so it states its share instead of
      // inventing a comparison that would be quietly wrong.
      const compare = (d) => !d
        ? 'No comparable prior period'
        : `${d.dir === 'up' ? '↑' : d.dir === 'down' ? '↓' : '–'} ${d.mag} from last year`;
      // named statLine, not stats - `stats(y)` is the year resolver above, and
      // reusing the name here would put it in the TDZ for all of render()
      const statLine = [
        ['Claims raised', num(S.total), compare(dClaims)],
        ['Credit given', usd(S.credit), compare(dCredit)],
        ['Still open', num(S.unresolved), `${pct(S.unresolved, S.total)} of claims raised this year`]
      ];

      const memoGap = df.reduce((a, d) => a + (d[6] - d[8]), 0);

      // Caption for the credit bands. It used to read "762 of 4,254 cost
      // nothing", which was a near-duplicate of the "Still open" stat already in
      // the line above - and it counted claims while the bars measure credit. This
      // one reads the chart instead: it names the band carrying the most money,
      // which is the bar drawn in red, and puts it in share terms.
      //
      // The band figures sum to S.credit, the same "Credit given" total printed
      // in the stat line above, so the denominator reconciles with it rather
      // than introducing a second version of the year's money.
      // Captions the band holding the most credit. It compares absolute values for
      // the same reason vbarFixed does, so the band named here is always the one
      // drawn in red even if the export ever carries a negative credit.
      const distSum = S.dist.reduce((a, d) => a + d[2], 0);
      const topBand = S.dist.length ? S.dist.reduce((a, d) => (Math.abs(d[2]) >= Math.abs(a[2]) ? d : a)) : null;

      // The department columns are declared once, next to deptTable, rather than
      // built here per render: every measure now sits in its own column at once, so
      // there is nothing left for the page to choose between and no per-render
      // lookup to keep in step with the header row.
      //
      // Worth keeping in mind if a rate is ever added back. "Credit per claim"
      // replaced a "cost nothing" tab that showed exactly the same numbers as
      // "still open": both counted claims that were open and uncredited, which in
      // this export are the same claims, since a claim stays open precisely because
      // it has not been credited yet. And open (d[5]) against noCredit (d[10]) held
      // the same value in 218 of 262 department rows - two labels over one number
      // reads as a broken button.

      document.getElementById('app').innerHTML = `
        <div class="row" style="margin-bottom:6px">
          <div><h1>Claims Dashboard</h1><span class="mu">${esc(S.range)}</span></div>
          <div class="sp"></div>
          <div class="dropdown">
            <button class="dd-trigger" type="button" aria-haspopup="listbox" aria-expanded="false"
              onclick="return yearMenu(this)">${year}<span class="dd-caret">▾</span></button>
            <div class="dd-menu year-menu" role="listbox" aria-label="Reporting year">
              ${YEARS.map((y) => `
                <button type="button" role="option" aria-selected="${year === y}" class="${year === y ? 'on' : ''}"
                  onclick="setYear(${y})">${y}${y === year ? '<span class="mu">current</span>' : ''}</button>`).join('')}
            </div>
          </div>
          <button class="btn" onclick="toast('Dashboard refreshed')">↻ Refresh</button>
        </div>

        <div class="stats">
          ${statLine.map(([label, value, note]) => `
            <div class="stat">
              <span class="sl">${esc(label)}</span>
              <b class="sv">${value}</b>
              <span class="sc">${esc(note)}</span>
            </div>`).join('')}
        </div>

        ${sect('Needs Attention', 'Patterns and metrics, most urgent first', '')}
        ${renderFindings()}

        <div class="split"></div>

        ${sect('This Year vs Last Year', n < MONTHS.length
          ? `${MONTHS[0]}–${MONTHS[n - 1]} of ${year} against the full year ${year - 1}`
          : `${MONTHS[0]}–${MONTHS[n - 1]} of both years`)}
        <div class="grid g2">
          <div class="card">
            ${cardTitle('Claims per month', '', `<span class="mgd ${cur.c > prev.c ? 'up' : 'dn'}" style="margin-top:0">${cur.c > prev.c ? '+' : '−'}${Math.abs(((cur.c - prev.c) / (prev.c || 1)) * 100).toFixed(1)}%</span>`)}
            ${monthCompare(n, num, num, 0)}
          </div>
          <div class="card">
            ${cardTitle('Credit per month', '', `<span class="mgd ${cur.v > prev.v ? 'up' : 'dn'}" style="margin-top:0">${cur.v > prev.v ? '+' : '−'}${Math.abs(((cur.v - prev.v) / (prev.v || 1)) * 100).toFixed(1)}%</span>`)}
            ${monthCompare(n, usd, usdK, 1)}
          </div>
        </div>

        ${sect('Where the Claims Come From', 'Team area, fault type and the site the product was sitting at')}
        <div class="grid g3">
          <div class="card dcard">
            ${cardTitle('Claims by status', '')}
            ${donut('status', S.status)}
          </div>
          <div class="card">
            ${cardTitle('Top claim types', '', seg('types', 'Count', 'Credit'))}
            ${hbar('types', typesShown)}
            <div class="row" style="margin-top:10px">
              <span class="mu" style="font-size:12px">${typesShown.length} of ${S.types.length} · ${pct(typesShown.reduce((a, t) => a + t[1], 0), S.total)}</span>
              <div class="sp"></div>
              <button class="btn s" onclick="toggleTypes()">${typesExpanded ? '— Top 10' : `+ ${S.types.length - TYPES_TOP}`}</button>
            </div>
          </div>
          <div class="card dcard">
            ${cardTitle('Claims by warehouse', `Ranked by claims raised in ${year}`)}
            ${whPie()}
          </div>
        </div>

        ${sect('Department Comparison', 'Every measure is its own column — red marks the highest in each — click any column to sort')}
        <div class="card">
          ${deptTable(df)}
          <div class="row" style="margin-top:10px">
            <span class="mu" style="font-size:12px">Red marks the highest value in its own column, judged against the other departments listed (ties included) · click a column header to sort · click a row for that department&rsquo;s detail</span>
          </div>
        </div>

        ${sect('Carrier Scorecard', 'Which courier the claims are actually against — click any column to sort')}
        <div class="card">
          ${cardTitle('Carrier scorecard', '')}
          ${carrierTable(cf)}
          <div class="row" style="margin-top:10px">
            <span class="mu" style="font-size:12px">${cf.length
              ? cf.reduce((a, c) => a + c[1], 0) + ' of ' + num(S.total) + ' claims name a carrier (' +
                pct(cf.reduce((a, c) => a + c[1], 0), S.total) + ' of claims raised)'
              : 'No claims name a carrier this year'} · the export has no Carrier column, so it is read
              from the department, claim type and description · the six reason columns are a
              breakdown of Claims, not six extra claims: each claim is counted against one reason or
              against "not a carrier fault", so they add up · no claim rate, because the export
              lists only orders that raised a claim, so the denominator would be the numerator
              · click a row for its detail</span>
          </div>
        </div>

        ${sect('Where the Money Goes')}
        <div class="grid g2">
          <div class="card">
            ${cardTitle('Credit by department', '', `<div class="seg" role="group">
              <button type="button" class="${deptMoney === 'amount' ? 'on' : ''}" aria-pressed="${deptMoney === 'amount'}" onclick="setDeptMoney('amount')">Amount</button>
              <button type="button" class="${deptMoney === 'share' ? 'on' : ''}" aria-pressed="${deptMoney === 'share'}" onclick="setDeptMoney('share')">Percent</button>
            </div>`)}
            ${deptCreditBars(df)}
            <div class="row" style="margin-top:10px">
              <span class="mu" style="font-size:12px">${Math.min(8, df.length)} of ${df.length} departments${memoGap > 0
                ? ` · <span class="b High">${usd(memoGap)}</span> credited with no credit memo sent`
                : ' · every credit has a matching memo'}</span>
            </div>
          </div>
          <div class="card">
            ${cardTitle('How big are the claims', '')}
            ${S.dist.length ? vbarFixed(S.dist, 2, usd) : '<p class="mu">No credited claims.</p>'}
            ${topBand ? `<div class="row" style="margin-top:10px">
              <span class="mu" style="font-size:12px">${esc(topBand[0])} alone carries <b>${pct(topBand[2], distSum)}</b> of the ${usd(distSum)} credited in ${esc(year)}.</span>
            </div>` : ''}
          </div>
        </div>`;
    }

    function main() {
      if (!requireAuth()) return;
      document.body.innerHTML = layout('dashboard');
      render();
    }
  </script>
</head>
<body>
  <script>main();</script>
</body>
</html>
