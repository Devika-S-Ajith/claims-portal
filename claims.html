<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Claims Portal – Claims</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    let filter = { q: '', st: '', pr: '', own: '', de: '', ty: '' };

    // Every list is built from the signed-in user's scope, so a manager can
    // never see another manager's rows no matter what the filters say.
    function inScope() {
      return scopedClaims();
    }

    function matches(c) {
      const q = filter.q.toLowerCase();
      return (
        (!filter.st || c.st === filter.st) &&
        (!filter.pr || c.pr === filter.pr) &&
        (!filter.de || c.de === filter.de) &&
        (!filter.ty || c.ty === filter.ty) &&
        (!filter.own || c.own === filter.own) &&
        (c.id + c.or + c.ty + c.de + (c.own_by || '')).toLowerCase().includes(q)
      );
    }

    function aiSuggestion(c) {
      if (c.ai === 'none') {
        return `<button class="btn s" onclick="generateSuggestion('${c.id}')">✨ Generate with AI</button>`;
      }
      const accepted = c.ai === 'acc';
      const [cause, resolution] = AI_SUGGESTIONS[c.ty] || AI_SUGGESTIONS.default;
      return `
        <div class="ai">
          <em>✨ AI Suggestion${accepted ? ' · Accepted' : ''}</em>
          <div><b>Root cause:</b> ${cause}</div>
          <div style="margin-top:4px"><b>Resolution:</b> ${resolution}</div>
          ${accepted ? '' : `
            <div class="row" style="margin-top:8px;gap:6px">
              <button class="btn s p" onclick="acceptSuggestion('${c.id}')">Accept</button>
              <button class="btn s" onclick="toast('Edit mode: change text, then Accept')">Edit</button>
              <button class="btn s" onclick="toast('Regenerated')">Regenerate</button>
            </div>`}
        </div>`;
    }

    function generateSuggestion(id) {
      const claim = CLAIMS.find((c) => c.id === id);
      if (claim) claim.ai = 'sug';
      renderResults();
    }

    function acceptSuggestion(id) {
      const claim = CLAIMS.find((c) => c.id === id);
      if (claim) claim.ai = 'acc';
      toast('AI suggestion accepted');
      renderResults();
    }

    function renderResults() {
      const rows =
        inScope()
          .filter(matches)
          .map((c) => `
            <tr>
              <td><b>${c.id}</b></td>
              <td>${esc(c.own_by || '—')}</td>
              <td>${c.or}</td>
              <td>${c.ty}</td>
              <td>${c.de}</td>
              ${isAdmin() ? `<td><span class="owner-chip ${(OWNERS.find((o) => o.id === c.own) || {}).role === 'Admin' ? 'adm' : 'mgr'}"><i></i>${esc(ownerName(c.own))}</span></td>` : ''}
              <td>${badge(c.st)}</td>
              <td>${money(c.am)}</td>
              <td>${aiSuggestion(c)}</td>
              <td>${badge(c.pr)}</td>
              <td><a class="btn s" href="claim-detail.html?id=${c.id}">Open</a></td>
            </tr>`)
          .join('') || `<tr><td colspan="11" class="mu">No claims in your scope match.</td></tr>`;
      document.getElementById('results').innerHTML = rows;
    }

    function filterSelect(key, options, label) {
      return `
        <select onchange="filter.${key}=this.value;renderResults()">
          <option value="">${label}</option>
          ${options.map((x) => `<option ${filter[key] === x ? 'selected' : ''}>${x}</option>`).join('')}
        </select>`;
    }

    function render() {
      const admin = isAdmin();
      const total = inScope().length;
      document.getElementById('app').innerHTML = `
        <div class="row" style="margin-bottom:4px">
          <div><h1>${admin ? 'Claims' : 'My Claims'}</h1><span class="mu">${num(total)} worked example${total === 1 ? '' : 's'} in your scope · ${num(OWNER_QUEUE.length)} claims still need work across the whole export</span></div>
          <div class="sp"></div>
          <button class="btn" onclick="toast('Exported claims.csv')">⇩ Export</button>
        </div>
        <div class="row" style="margin-bottom:14px">
          <span class="b ${admin ? 'Low' : 'Med'}">${admin ? 'Admin · all claims' : 'Manager · your caseload only'}</span>
          <span class="mu" style="font-size:12px">${admin
            ? `This table shows the ${num(total)} claims with real narrative content, drawn from ${num(DATA_QUALITY.total)} total. Every claim is listed on the dashboards.`
            : `Only claims owned by ${esc(getSession().name)} are listed.`}</span>
        </div>
        <div class="card">
          <div class="row" style="margin-bottom:14px">
            <input id="q" placeholder="Search claim, order, type…" value="${filter.q}"
                   oninput="filter.q=this.value;renderResults()" style="min-width:240px">
            ${filterSelect('st', ['Open', 'Resolved', 'Cancelled', 'Denied'], 'Status')}
            ${filterSelect('de', [...new Set(inScope().map((c) => c.de))].sort(), 'Department')}
            ${filterSelect('ty', [...new Set(inScope().map((c) => c.ty))].sort(), 'Claim type')}
            ${filterSelect('pr', ['High', 'Medium', 'Low'], 'Priority')}
            ${admin ? `
              <select onchange="filter.own=this.value;renderResults()">
                <option value="">All owners</option>
                ${OWNERS.map((o) => `<option value="${o.id}"${filter.own === o.id ? ' selected' : ''}>${esc(o.name)}</option>`).join('')}
              </select>` : ''}
          </div>
          <div class="tw"><table>
            <tr><th>Claim ID</th><th>Raised by</th><th>Order ID</th><th>Claim Type</th><th>Department</th>${admin ? '<th>Owner</th>' : ''}<th>Status</th><th>Credit</th><th>AI Root Cause / Resolution</th><th>Priority</th><th></th></tr>
            <tbody id="results"></tbody>
          </table></div>
        </div>`;
      renderResults();
    }

    function main() {
      if (!requireAuth()) return;
      document.body.innerHTML = layout('claims');
      const st = new URLSearchParams(location.search).get('st');
      if (st) filter.st = st;
      render();
    }
  </script>
</head>
<body>
  <script>main();</script>
</body>
</html>
