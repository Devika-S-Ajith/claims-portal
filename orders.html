<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Claims Portal – Orders</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="products.js"></script>
  <script>
    // ------------------------------------------------------------------
    // What is actually listed here, because the list is not the export.
    //
    // The export has 25,485 distinct OrderIDs, but an order that raised one
    // claim and was closed has nothing left to work on and no way to tell it
    // apart from the 24,000 others in the same state. build-data.js therefore
    // keeps only orders that raised more than one claim OR still hold an open
    // one, sorts those by claim count, and embeds the top 400. Every one of the
    // 400 is a repeat-claim order - the open-claim branch added nothing on its
    // own - so the "repeat" filter below is the whole list by construction.
    //
    // The counts on this page are therefore counts within that 400, not across
    // the export, and the header says so rather than implying it is everything.
    //
    // The export carries OrderID and nothing else about the order: no customer,
    // product, quantity, price or carrier. So an "order" here is a real
    // aggregate of the claims raised against it.
    //   [id, claims, credit, open, deptCount, firstClaim, lastClaim, orderType, owners, carrier]
    //
    // A carrier is the one thing here that is not a column in the export. It is
    // read out of the department, claim type and description of the claims
    // raised against the order, in build-data.js, and it is blank when none of
    // them name one - which is most orders. A blank means "not stated", not
    // "shipped by ourselves", so it is rendered as a dash and never guessed.
    // ------------------------------------------------------------------
    let selectedOrder = '';
    let orderQuery = '';
    let orderFilter = 'all';
    let orderOwner = '';   // an owner id, or '' for every routed owner (admin only)
    let pageSize = 10;
    let page = 1;

    // Every cut is expressible against the embedded columns, so no filter here
    // has to invent a field the export does not carry. Thresholds are stated in
    // the labels rather than hidden, so a reader knows what a filter is selecting.
    const FILTERS = [
      ['all', () => true, 'All orders'],
      ['open', (o) => o[3] > 0, 'Still hold an open claim'],
      ['repeat3', (o) => o[1] >= 3, '3+ claims raised'],
      ['cross', (o) => o[4] > 1, 'Spans more than one department'],
      ['big', (o) => o[2] >= 1000, 'Credit of $1,000 or more'],
      ['carrier', (o) => !!o[9], 'Claims name a carrier']
    ];
    const PAGE_SIZES = [10, 25, 50, 100];

    const orderOwners = (o) => (o[8] || '').split('~').filter(Boolean);
    const orderLabel = (o) => o[7] || 'Customer Order';
    const CARRIER_MIXED = 'UPS/FedEx';
    function carrierCell(c, withWhy) {
      if (!c) return `<span class="mu" style="font-size:11px" title="No claim on this order names a carrier in its department, type or description.">—</span>`;
      const mixed = c === CARRIER_MIXED;
      return `<span${mixed ? ' class="b Med" title="Claims on this order name both UPS and FedEx, so it is not filed under either."' : ''}>${esc(c)}</span>` +
        (withWhy ? (mixed ? ' <span class="mu" style="font-size:11px">both named in the claims</span>'
          : ' <span class="mu" style="font-size:11px">from the claims</span>') : '');
    }

    // ---------------------------------------------------------------- products
    // Product, customer, quantity and price are not columns in the claims export;
    // they arrive later from a separate order-system export joined by OrderID.
    // Until that join exists the section below reads the clearly-labelled sample
    // set in products.js. It is scoped the same way the orders table is: a
    // manager only sees products that touch an order in their own caseload.
    const PRODUCT_TIER_RANK = { Critical: 0, Watch: 1, Normal: 2 };

    function scopedProducts() {
      const s = getSession();
      const all = SAMPLE_PRODUCTS.slice();
      if (!s || s.role === 'Admin') return all;
      const mine = new Set(ORDERS.filter((o) => orderOwners(o).includes(s.id)).map((o) => o[0]));
      return all.filter((p) => p.orderIds.some((id) => mine.has(id)));
    }

    // Worst first: tier, then claim rate, then volume. Sorting on rate alone
    // would let a thin-base product leapfrog a larger, better-supported one.
    function sortedProducts(list) {
      return list.slice().sort((a, b) =>
        PRODUCT_TIER_RANK[productTier(a)] - PRODUCT_TIER_RANK[productTier(b)] ||
        productClaimRate(b) - productClaimRate(a) ||
        b.totalOrders - a.totalOrders);
    }

    function openProduct(id) { location.href = 'product-detail.html?id=' + encodeURIComponent(id); }

    // Role scope first, then the reader's own cuts. A manager is already down to
    // their caseload here, so the owner filter is only offered to an admin - for
    // anyone else it would be a control with exactly one possible value.
    function filteredOrders() {
      const s = getSession();
      let rows = ORDERS;
      if (s && s.role !== 'Admin') rows = rows.filter((o) => orderOwners(o).includes(s.id));
      if (orderOwner) rows = rows.filter((o) => orderOwners(o).includes(orderOwner));
      const f = (FILTERS.find((x) => x[0] === orderFilter) || FILTERS[0])[1];
      rows = rows.filter(f);
      const q = orderQuery.trim().toLowerCase();
      if (q) rows = rows.filter((o) => String(o[0]).toLowerCase().includes(q));
      return rows;
    }

    // A page count is not a row count: the last page holds whatever is left, so
    // it is almost never full. The pager therefore numbers pages, not rows, and
    // the caption states the row range actually on screen. Clamping here rather
    // than in a handler means a filter that shrinks the list can never leave the
    // page pointing past the end.
    function pageSlice(rows) {
      const pages = Math.max(1, Math.ceil(rows.length / pageSize));
      page = Math.min(Math.max(1, page), pages);
      const from = (page - 1) * pageSize;
      return { page, pages, from, to: Math.min(from + pageSize, rows.length), rows: rows.slice(from, from + pageSize) };
    }

    function setPage(n) { page = n; render(); }
    function setPageSize(n) { pageSize = n; page = 1; render(); }

    // Every filter change returns to page 1: staying on page 7 of a list that
    // now has one page reads as "no results" when there are results.
    function setFilter(k, v) {
      if (k === 'orderQuery') orderQuery = v; else orderFilter = v;
      page = 1;
      render(true);
    }
    function setOwner(v) { orderOwner = v; page = 1; render(); }

    // Page numbers with the run around the current page kept and the rest
    // elided - 40 buttons is a worse control than none.
    function pageButtons(p) {
      const wanted = new Set([1, 2, p.page - 1, p.page, p.page + 1, p.pages - 1, p.pages]);
      let out = '';
      let prev = 0;
      [...wanted].filter((n) => n >= 1 && n <= p.pages).sort((a, b) => a - b).forEach((n) => {
        if (n - prev > 1) out += '<span class="pgap" aria-hidden="true">…</span>';
        out += `<button type="button" class="pgnum${n === p.page ? ' on' : ''}" onclick="setPage(${n})"` +
          `${n === p.page ? ' aria-current="page"' : ''}>${n}</button>`;
        prev = n;
      });
      return out;
    }

    function pager(p, total) {
      if (!total) return '';
      const one = p.pages < 2;
      const off = (b) => (one || b ? ' disabled' : '');
      return `<div class="pager">
        <span class="mu">Showing ${num(p.from + 1)}–${num(p.to)} of ${num(total)} matching order${total === 1 ? '' : 's'} · page ${p.page} of ${p.pages}</span>
        <div class="sp"></div>
        <select onchange="setPageSize(+this.value)" aria-label="Orders per page" style="font-size:12px;padding:4px 8px">
          ${PAGE_SIZES.map((n) => `<option value="${n}"${n === pageSize ? ' selected' : ''}>${n} per page</option>`).join('')}
        </select>
        <button type="button" class="pgnum" onclick="setPage(1)"${off(p.page <= 1)} aria-label="First page">&#171;</button>
        <button type="button" class="pgnum" onclick="setPage(${p.page - 1})${off(p.page <= 1)}" aria-label="Previous page">&#8249;</button>
        ${pageButtons(p)}
        <button type="button" class="pgnum" onclick="setPage(${p.page + 1})${off(p.page >= p.pages)}" aria-label="Next page">&#8250;</button>
        <button type="button" class="pgnum" onclick="setPage(${p.pages})${off(p.page >= p.pages)}" aria-label="Last page">&#187;</button>
      </div>`;
    }

    function render(keepSearch) {
      const orders = filteredOrders();
      const p = pageSlice(orders);
      const shown = p.rows;
      const s = getSession();
      const admin = isAdmin();

      // Selection is held against the whole filtered set, not the visible page,
      // so paging away from a selected order and back keeps it selected.
      if (!orders.some((o) => o[0] === selectedOrder)) selectedOrder = orders.length ? orders[0][0] : '';
      const order = orders.find((o) => o[0] === selectedOrder) || orders[0];

      const related = order
        ? scopedClaims().filter((c) => c.or === order[0])
        : [];

      // Sample product rows for this order, or an empty list when the join has
      // no product for it. The detail panel prints PRODUCT_DATA_MISSING in that
      // case rather than an invented product.
      const orderProducts = order ? productsForOrder(order[0]) : [];

      const totalCredit = orders.reduce((a, o) => a + o[2], 0);
      const totalClaims = orders.reduce((a, o) => a + o[1], 0);
      const repeat = orders.filter((o) => o[1] > 1).length;
      const filterLabel = (FILTERS.find((x) => x[0] === orderFilter) || FILTERS[0])[2];
      const narrowed = orderFilter !== 'all' || orderQuery.trim() || orderOwner;

      // Problem Products. Sample product rows scoped to the signed-in role.
      const products = scopedProducts();
      const productsSorted = sortedProducts(products);
      const prodCritical = products.filter((p) => productTier(p) === 'Critical').length;
      const prodWatch = products.filter((p) => productTier(p) === 'Watch').length;
      const prodClaims = products.reduce((a, p) => a + p.totalClaims, 0);

      document.getElementById('app').innerHTML = `
        <div class="row" style="margin-bottom:4px">
          <div><h1>Orders</h1><span class="mu">${num(orders.length)} order${orders.length === 1 ? '' : 's'} in your scope · ${num(totalClaims)} claims · ${usd(totalCredit)} credit</span></div>
        </div>
        <div class="row" style="margin-bottom:14px">
          <span class="b ${admin ? 'Low' : 'Med'}">${admin ? 'Admin · all orders' : 'Manager · your caseload only'}</span>
          <span class="mu" style="font-size:12px">${admin
            ? `The ${num(ORDERS.length)} orders that raised more than one claim or still hold an open one, out of ${num(25485)} in the export.`
            : `Your orders out of the ${num(ORDERS.length)} listed · only orders carrying a claim routed to ${esc(s.name)}.`}</span>
          <div class="sp"></div>
          <div class="qsearch">
            <input id="orderq" placeholder="Find order ID" value="${esc(orderQuery)}" oninput="setFilter('orderQuery', this.value)" style="padding-right:11px">
          </div>
          <select onchange="orderFilter=this.value;page=1;render()" aria-label="Filter orders" title="Filter orders">
            ${FILTERS.map(([k, , label]) => `<option value="${k}"${k === orderFilter ? ' selected' : ''}>${label}</option>`).join('')}
          </select>
          ${admin ? `<select onchange="setOwner(this.value)" aria-label="Filter by routed owner" title="Filter by routed owner">
            <option value=""${orderOwner ? '' : ' selected'}>All routed owners</option>
            ${OWNERS.map((o) => `<option value="${o.id}"${orderOwner === o.id ? ' selected' : ''}>${esc(o.name)}</option>`).join('')}
          </select>` : ''}
          ${narrowed ? `<button class="btn s" onclick="orderQuery='';orderFilter='all';orderOwner='';page=1;render()">Clear</button>` : ''}
        </div>

        <div class="grid" style="grid-template-columns:3fr 2fr;align-items:start">
          <div class="card tw"><table>
            <tr><th>Order ID</th><th>Type</th><th>Carrier</th><th>Claims</th><th>Open</th><th>Credit</th><th>Depts</th><th>First–last claim</th></tr>
            ${shown.length ? shown.map((o) => `
              <tr class="cl${o[0] === selectedOrder ? ' on' : ''}" onclick="selectedOrder='${o[0]}';render()">
                <td><b>${o[0]}</b>${o[1] > 1 ? ` <span class="b Med">repeat ×${o[1]}</span>` : ''}</td>
                <td>${esc(orderLabel(o))}</td>
                <td>${carrierCell(o[9])}</td>
                <td>${num(o[1])}</td>
                <td>${o[3] ? `<span class="b Med">${num(o[3])}</span>` : '0'}</td>
                <td>${usd(o[2])}</td>
                <td>${num(o[4])}</td>
                <td class="mu" style="font-size:11px">${esc(fmtDate(o[5]))} → ${esc(fmtDate(o[6]))}</td>
              </tr>`).join('')
              : `<tr><td colspan="8" class="mu">No orders match this filter.</td></tr>`}
          </table>
          ${pager(p, orders.length)}
          </div>

          ${order ? `
          <div class="card"><h3>Order ${order[0]}</h3>
            <dl class="dl">
              <dt>Order type</dt><dd>${esc(orderLabel(order))}</dd>
              <dt>Products</dt><dd>${orderProducts.length
                ? orderProducts.map((p) => `<a style="color:var(--pr)" href="product-detail.html?id=${encodeURIComponent(p.id)}">${esc(p.name)}</a> <span class="b ${PRODUCT_TIER_CLASS[productTier(p)]}">${esc(productTier(p))}</span> <span class="mu" style="font-size:11px">sample</span>`).join('<br>')
                : `<span class="mu" title="No order-system join exists yet, and this order is not in the sample set.">${PRODUCT_DATA_MISSING}.</span>`}</dd>
              <dt>Carrier</dt><dd>${carrierCell(order[9], true)}</dd>
              <dt>Claims raised</dt><dd>${num(order[1])}${order[1] > 1 ? ` <span class="b Med">repeat claim order</span>` : ''}</dd>
              <dt>Still open</dt><dd>${num(order[3])}</dd>
              <dt>Total credit</dt><dd>${usd(order[2])}</dd>
              <dt>Departments involved</dt><dd>${num(order[4])}</dd>
              <dt>Claim window</dt><dd>${esc(fmtDate(order[5]))} → ${esc(fmtDate(order[6]))}</dd>
              <dt>Routed owners</dt><dd>${orderOwners(order).map((id) => {
                const o = OWNERS.find((x) => x.id === id);
                return o ? `<span class="owner-chip ${o.role === 'Admin' ? 'adm' : 'mgr'}"><i></i>${esc(o.name)}</span>` : esc(id);
              }).join(' ')}</dd>
              <dt>Worked claims</dt><dd>${related.length
                ? related.map((c) => `<a style="color:var(--pr)" href="claim-detail.html?id=${c.id}">${c.id}</a>`).join(', ')
                : '<span class="mu">No claim from this order is in the worked-examples set.</span>'}</dd>
            </dl>
            <p class="mu" style="font-size:11px;margin-top:12px;line-height:1.6">
              The export contains no customer, product, quantity or price fields, so those columns
              cannot be shown for any order. Everything above except Products is measured from the
              claim rows that reference this OrderID. Products is the exception the other way: it is
              <b>sample data</b> from the future order-system join (see products.js), or the plain
              "not available" note when this order is not in that sample set &mdash; never an invented
              figure. Carrier is likewise not a column: it is read out of the department, claim type
              and description of this order's claims. ${num(orders.length ? ORDERS.filter((o) => o[9]).length : 0)} of the ${num(ORDERS.length)}
              listed orders name one, and the rest show a dash because "not stated" is not "shipped
              in our own van".
            </p>
          </div>` : ''}
        </div>

        <div class="row sec" style="margin-top:24px">
          <div><h3>Repeat-claim orders</h3><span class="mu">${num(repeat)} of the ${num(orders.length)} orders in scope raised more than one claim${narrowed ? ` · currently filtered to “${esc(filterLabel)}”` : ''}</span></div>
        </div>
        <div class="grid g4">
          <div class="card kpi"><small>Orders in scope</small><b>${num(orders.length)}</b><span class="flat">${num(totalClaims)} claims behind them</span></div>
          <div class="card kpi"><small>Repeat-claim orders</small><b>${num(repeat)}</b><span class="up">${pct(repeat, orders.length)} of orders</span></div>
          <div class="card kpi"><small>Credit on these orders</small><b>${usd(totalCredit)}</b><span class="flat">${usd(orders.length ? totalCredit / orders.length : 0)} average</span></div>
          <div class="card kpi"><small>Orders with open claims</small><b>${num(orders.filter((o) => o[3] > 0).length)}</b><span class="up">still unresolved work</span></div>
        </div>

        <div class="row sec" style="margin-top:28px">
          <div><h3>Problem Products</h3><span class="mu">Claim rate by product, worst first · click a product for its detail</span></div>
          <div class="sp"></div>
          <span class="b Med" title="Product, customer, quantity and price are not columns in the claims export. These figures are sample data for the prototype, not measured from the CSV.">Sample data</span>
        </div>
        <div class="grid g4">
          <div class="card kpi"><small>Products tracked</small><b>${num(products.length)}</b><span class="flat">in your scope</span></div>
          <div class="card kpi"><small>Critical</small><b>${num(prodCritical)}</b><span class="up">high rate with enough volume to trust</span></div>
          <div class="card kpi"><small>Watch</small><b>${num(prodWatch)}</b><span class="flat">thin base, or a moderate rate at volume</span></div>
          <div class="card kpi"><small>Claims behind them</small><b>${num(prodClaims)}</b><span class="flat">sample claims on these products</span></div>
        </div>
        <div class="card tw" style="margin-top:16px"><table>
          <tr><th>Product</th><th>Tier</th><th>Claim rate</th><th>Orders</th><th>Claims</th><th>Top claim type</th><th>Suppliers</th></tr>
          ${productsSorted.length ? productsSorted.map((p) => {
            const tier = productTier(p);
            const top = p.types[0] || ['—', 0];
            return `
            <tr class="cl" onclick="openProduct('${p.id}')" tabindex="0" role="link"
                onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openProduct('${p.id}')}">
              <td><b>${esc(p.name)}</b> <span class="mu" style="font-size:11px">${esc(p.id)}</span></td>
              <td>${tierBadge(tier)}</td>
              <td><b style="font-variant-numeric:tabular-nums">${(productClaimRate(p) * 100).toFixed(1)}%</b></td>
              <td>${num(p.totalOrders)}</td>
              <td>${num(p.totalClaims)}</td>
              <td>${esc(top[0])} <span class="mu" style="font-size:11px">${num(top[1])}</span></td>
              <td>${p.suppliers.length > 1 ? `${num(p.suppliers.length)} suppliers` : '1 supplier'}</td>
            </tr>`;
          }).join('')
            : `<tr><td colspan="7" class="mu">No product data is available for the orders in your scope.</td></tr>`}
        </table></div>
        <p class="mu" style="font-size:11px;margin-top:12px;line-height:1.6">
          Product, customer, quantity and price are not columns in the claims export. The figures in this
          section are <b>sample data</b> (see products.js), standing in for a future order-system export
          joined by Order ID &mdash; they are not measured from the CSV. A product is listed only once it
          touches an order in your scope. Tier rule: <b>Critical</b> needs a claim rate above 15% and at
          least 50 orders behind it; <b>Watch</b> is either a high rate on too few orders to trust, or a
          moderate rate at volume; everything else is <b>Normal</b>. Ranking puts tier first, so a
          thin-base product cannot outrank a larger, better-supported one.
        </p>`;

      // Re-rendering the page replaces the search box, which would otherwise drop
      // focus on the first keystroke and make typing an order ID impossible.
      // Re-focusing and pinning the caret to the end keeps it usable.
      if (keepSearch) {
        const box = document.getElementById('orderq');
        if (box) {
          box.focus();
          box.setSelectionRange(box.value.length, box.value.length);
        }
      }
    }

    function main() {
      if (!requireAuth()) return;
      document.body.innerHTML = layout('orders');
      render();
    }
  </script>
</head>
<body>
  <script>main();</script>
</body>
</html>
